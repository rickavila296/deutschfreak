# Short greeting dialogues for A1.1.U01.L01 (situation:erste-begegnung: one informal, one formal; Curriculum
# Specification §14 Launch situations). Composed by Claude Code only from L01's new language; every line is listed
# in docs/content-review/A1.1.U01.md for the teacher. Voices per decision 0011.
dialogues:
  - code: "dlg:erste-begegnung-01"
    slug: "erste-begegnung-01"
    title: "Hello and bye"
    register: informal
    lines:
      - code: "dlg:erste-begegnung-01:l01"
        speaker_role: "Course participant A"
        german: "Hallo!"
        meaning_en: "Hi!"
        voice: "voice:thorsten"
      - code: "dlg:erste-begegnung-01:l02"
        speaker_role: "Course participant B"
        german: "Hallo!"
        meaning_en: "Hi!"
        voice: "voice:kerstin"
      - code: "dlg:erste-begegnung-01:l03"
        speaker_role: "Course participant A"
        german: "Tschüss, bis später!"
        meaning_en: "Bye, see you later!"
        voice: "voice:thorsten"
      - code: "dlg:erste-begegnung-01:l04"
        speaker_role: "Course participant B"
        german: "Tschüss!"
        meaning_en: "Bye!"
        voice: "voice:kerstin"
  - code: "dlg:erste-begegnung-02"
    slug: "erste-begegnung-02"
    title: "Good morning and goodbye"
    register: formal
    lines:
      - code: "dlg:erste-begegnung-02:l01"
        speaker_role: "Neighbour"
        german: "Guten Morgen!"
        meaning_en: "Good morning!"
        voice: "voice:kerstin"
      - code: "dlg:erste-begegnung-02:l02"
        speaker_role: "New neighbour"
        german: "Guten Morgen!"
        meaning_en: "Good morning!"
        voice: "voice:thorsten"
      - code: "dlg:erste-begegnung-02:l03"
        speaker_role: "Neighbour"
        german: "Auf Wiedersehen!"
        meaning_en: "Goodbye!"
        voice: "voice:kerstin"
      - code: "dlg:erste-begegnung-02:l04"
        speaker_role: "New neighbour"
        german: "Auf Wiedersehen!"
        meaning_en: "Goodbye!"
        voice: "voice:thorsten"
