# A1 curriculum structure. Source: docs/sources/a1-curriculum-specification.md, sections 3 to 7 and 20.
# Codes are permanent and written literally (Spec, Stable codes). Order sets position.
# One skill per learning objective: docs/decisions/0006 (PLAN-DEC-02).
# Spec gaps filled by owner decisions: docs/decisions/0001 (U06 subtitles, U01 split) and 0002 (A1.4.U06 objectives).

level:
  code: "A1"
  title: "German A1"
  parts:
    - code: "A1.1"
      title: "Foundations"
      tagline: "I can begin communicating."
      units:
        - code: "A1.1.U01"
          title: "Hallo!"
          slug: "hallo"
          subtitle_en: "First contact"
          lessons:
            - code: "A1.1.U01.L01"
              title: "Hallo und Tschüss"
              slug: "hallo-und-tschuess"
              archetypes: [conversation]
              mastery_task_en: "Hear or see 6 situations and say the fitting greeting"
              objectives:
                - code: "A1.1.U01.L01.O1"
                  can_do_en: "Greet and say goodbye to suit time of day and formality"
                  skill: "spoken_interaction"
            - code: "A1.1.U01.L02"
              title: "Wie heißt du?"
              slug: "wie-heisst-du"
              archetypes: [conversation]
              mastery_task_en: "Complete two exchanges aloud, one informal and one formal"
              objectives:
                - code: "A1.1.U01.L02.O1"
                  can_do_en: "Give a name and ask for one, with du and with Sie"
                  skill: "spoken_interaction"
            - code: "A1.1.U01.L03"
              title: "Das Alphabet"
              slug: "das-alphabet"
              archetypes: [pronunciation]
              mastery_task_en: "Write 5 names from spelling audio; spell own name"
              objectives:
                - code: "A1.1.U01.L03.O1"
                  can_do_en: "Spell a name and write down a spelled name"
                  skill: "pronunciation"
            - code: "A1.1.U01.L04"
              title: "Wie geht's?"
              slug: "wie-gehts"
              archetypes: [conversation]
              mastery_task_en: "Complete a greeting dialogue aloud in both registers"
              objectives:
                - code: "A1.1.U01.L04.O1"
                  can_do_en: "Ask how someone is and answer"
                  skill: "spoken_interaction"
            - code: "A1.1.U01.L05"
              title: "Checkpoint: Erste Begegnung"
              slug: "checkpoint-erste-begegnung"
              archetypes: [checkpoint]
              mastery_task_en: "Branching roleplay with an audio partner: greet, names, spell, how are you, goodbye"
              objectives:
                - code: "A1.1.U01.L05.O1"
                  can_do_en: "Hold a first-meeting exchange of 6–8 turns"
                  skill: "spoken_interaction"
        - code: "A1.1.U02"
          title: "Woher kommst du?"
          slug: "woher-kommst-du"
          subtitle_en: "Origin, home, languages"
          lessons:
            - code: "A1.1.U02.L01"
              title: "Ich komme aus…"
              slug: "ich-komme-aus"
              archetypes: [conversation]
              mastery_task_en: "Answer 4 audio questions about themselves"
              objectives:
                - code: "A1.1.U02.L01.O1"
                  can_do_en: "Say where they come from and live, and ask"
                  skill: "spoken_interaction"
            - code: "A1.1.U02.L02"
              title: "Ich, du, er, sie"
              slug: "ich-du-er-sie"
              archetypes: [grammar]
              mastery_task_en: "Build 8 sentences about three people from profile cards"
              objectives:
                - code: "A1.1.U02.L02.O1"
                  can_do_en: "Use singular present-tense endings about self and others"
                  skill: "grammar"
            - code: "A1.1.U02.L03"
              title: "Fragen stellen"
              slug: "fragen-stellen"
              archetypes: [grammar]
              mastery_task_en: "Order 8 scrambled sentences; ask an audio persona 4 questions"
              objectives:
                - code: "A1.1.U02.L03.O1"
                  can_do_en: "Ask and answer W-questions and yes/no questions with the verb in the right place"
                  skill: "grammar"
            - code: "A1.1.U02.L04"
              title: 'Sprachen und „Wie bitte?"'
              slug: "sprachen-und-wie-bitte"
              archetypes: [conversation]
              mastery_task_en: "React to 5 too-fast audio lines with a fitting repair phrase"
              objectives:
                - code: "A1.1.U02.L04.O1"
                  can_do_en: "Say which languages they speak and manage non-understanding"
                  skill: "spoken_interaction"
            - code: "A1.1.U02.L05"
              title: "Checkpoint: Sich vorstellen"
              slug: "checkpoint-sich-vorstellen"
              archetypes: [checkpoint]
              mastery_task_en: "30-second spoken introduction and a 4-sentence written one"
              objectives:
                - code: "A1.1.U02.L05.O1"
                  can_do_en: "Introduce themselves in speech and writing"
                  skill: "spoken_production"
        - code: "A1.1.U03"
          title: "Zahlen und Daten"
          slug: "zahlen-und-daten"
          subtitle_en: "Numbers and personal details"
          lessons:
            - code: "A1.1.U03.L01"
              title: "Null bis zwanzig"
              slug: "null-bis-zwanzig"
              archetypes: [vocabulary]
              mastery_task_en: "Write down 5 phone numbers from audio; say their own"
              objectives:
                - code: "A1.1.U03.L01.O1"
                  can_do_en: "Say and understand 0–20 and phone numbers"
                  skill: "vocabulary"
            - code: "A1.1.U03.L02"
              title: "Einundzwanzig"
              slug: "einundzwanzig"
              archetypes: [vocabulary]
              mastery_task_en: "Write 10 heard numbers; say 5 ages"
              objectives:
                - code: "A1.1.U03.L02.O1"
                  can_do_en: "Say and understand 21–100 and give an age"
                  skill: "vocabulary"
            - code: "A1.1.U03.L03"
              title: "Ich bin, wir sind"
              slug: "ich-bin-wir-sind"
              archetypes: [grammar]
              mastery_task_en: "Produce 8 sentences about themselves and a group"
              objectives:
                - code: "A1.1.U03.L03.O1"
                  can_do_en: "Use all forms of sein to say who and how people are"
                  skill: "grammar"
            - code: "A1.1.U03.L04"
              title: "Ein Formular ausfüllen"
              slug: "ein-formular-ausfuellen"
              archetypes: [reading, writing]
              mastery_task_en: "Fill a form for themselves, and a second from dictated details"
              objectives:
                - code: "A1.1.U03.L04.O1"
                  can_do_en: "Read and complete a simple personal-data form"
                  skill: "writing"
            - code: "A1.1.U03.L05"
              title: "Checkpoint: Persönliche Daten"
              slug: "checkpoint-persoenliche-daten"
              archetypes: [checkpoint]
              mastery_task_en: "Roleplay: give name with spelling, number, address, age; note the other person's details"
              objectives:
                - code: "A1.1.U03.L05.O1"
                  can_do_en: "Exchange personal details accurately"
                  skill: "spoken_interaction"
        - code: "A1.1.U04"
          title: "Dinge"
          slug: "dinge"
          subtitle_en: "Things, gender, articles"
          lessons:
            - code: "A1.1.U04.L01"
              title: "Was ist das?"
              slug: "was-ist-das"
              archetypes: [grammar, vocabulary]
              mastery_task_en: "Choose the gender of 14 nouns; name 8 pictured objects aloud"
              objectives:
                - code: "A1.1.U04.L01.O1"
                  can_do_en: "Name everyday objects with the right article"
                  skill: "vocabulary"
            - code: "A1.1.U04.L02"
              title: "Ein, eine, kein"
              slug: "ein-eine-kein"
              archetypes: [grammar]
              mastery_task_en: "Correct 6 false statements aloud"
              objectives:
                - code: "A1.1.U04.L02.O1"
                  can_do_en: "Say what something is and is not; refer back with er / sie / es"
                  skill: "grammar"
            - code: "A1.1.U04.L03"
              title: "Eins, zwei, viele"
              slug: "eins-zwei-viele"
              archetypes: [grammar, vocabulary]
              mastery_task_en: "Recall the plural of 14 known nouns; count objects in a picture"
              objectives:
                - code: "A1.1.U04.L03.O1"
                  can_do_en: "Understand and form common plurals; say how many"
                  skill: "grammar"
            - code: "A1.1.U04.L04"
              title: "Checkpoint: Mein Schreibtisch"
              slug: "checkpoint-mein-schreibtisch"
              archetypes: [checkpoint]
              mastery_task_en: "Describe a desk photo in 5 sentences, spoken and written"
              objectives:
                - code: "A1.1.U04.L04.O1"
                  can_do_en: "Describe the objects around them"
                  skill: "spoken_production"
        - code: "A1.1.U05"
          title: "Familie"
          slug: "familie"
          subtitle_en: "Family and people"
          lessons:
            - code: "A1.1.U05.L01"
              title: "Meine Familie"
              slug: "meine-familie"
              archetypes: [vocabulary]
              mastery_task_en: "From audio, pick the right person in a family tree; introduce 3 relatives"
              objectives:
                - code: "A1.1.U05.L01.O1"
                  can_do_en: "Name family members and introduce them"
                  skill: "vocabulary"
            - code: "A1.1.U05.L02"
              title: "Ich habe…"
              slug: "ich-habe"
              archetypes: [grammar]
              mastery_task_en: "Question-and-answer about family with an audio persona"
              objectives:
                - code: "A1.1.U05.L02.O1"
                  can_do_en: "Say who and what they have and do not have"
                  skill: "grammar"
            - code: "A1.1.U05.L03"
              title: "Wie ist er? Wie ist sie?"
              slug: "wie-ist-er-wie-ist-sie"
              archetypes: [grammar, conversation]
              mastery_task_en: "Describe two people from profiles; choose the possessive in 8 items"
              objectives:
                - code: "A1.1.U05.L03.O1"
                  can_do_en: "Describe a person and say whose relative they are"
                  skill: "grammar"
            - code: "A1.1.U05.L04"
              title: "Checkpoint: Meine Familie"
              slug: "checkpoint-meine-familie"
              archetypes: [checkpoint]
              mastery_task_en: "Write 5–6 sentences; speak for 30–40 seconds"
              objectives:
                - code: "A1.1.U05.L04.O1"
                  can_do_en: "Understand a short family text and present their own family"
                  skill: "spoken_production"
        - code: "A1.1.U06"
          title: "A1.1 Abschluss"
          slug: "a1-1-abschluss"
          subtitle_en: "Part review and checkpoint"
          lessons:
            - code: "A1.1.U06.L01"
              title: "Drei Leute, drei Geschichten (Sound Check 1)"
              slug: "drei-leute-drei-geschichten"
              archetypes: [integrated]
              mastery_task_en: "Comprehension questions; 12 minimal-pair items at 80% or better"
              objectives:
                - code: "A1.1.U06.L01.O1"
                  can_do_en: "Understand three short profiles as text and audio, and compare them"
                  skill: "reading"
            - code: "A1.1.U06.L02"
              title: "A1.1 Checkpoint"
              slug: "a1-1-checkpoint"
              archetypes: [checkpoint]
              mastery_task_en: "Meet a new neighbour (roleplay); complete the form; write 6 sentences on self and family; 25 mixed vocabulary and grammar items"
              objectives:
                - code: "A1.1.U06.L02.O1"
                  can_do_en: "Function across all A1.1 objectives"
                  skill: "spoken_interaction"
    - code: "A1.2"
      title: "Everyday German"
      tagline: "I can handle familiar everyday situations."
      units:
        - code: "A1.2.U01"
          title: "Essen und Trinken"
          slug: "essen-und-trinken"
          subtitle_en: "Food, drink and the accusative"
          lessons:
            - code: "A1.2.U01.L01"
              title: "Was isst du gern?"
              slug: "was-isst-du-gern"
              archetypes: [vocabulary]
              mastery_task_en: "Say 8 likes and dislikes; note who likes what from audio"
              objectives:
                - code: "A1.2.U01.L01.O1"
                  can_do_en: "Say what they like and dislike eating and drinking"
                  skill: "vocabulary"
            - code: "A1.2.U01.L02"
              title: "Ich möchte einen Kaffee"
              slug: "ich-moechte-einen-kaffee"
              archetypes: [grammar]
              mastery_task_en: "Order 6 menu items aloud with the correct article"
              objectives:
                - code: "A1.2.U01.L02.O1"
                  can_do_en: "Order food and drink with the right article form"
                  skill: "grammar"
            - code: "A1.2.U01.L03"
              title: "Den Salat, bitte"
              slug: "den-salat-bitte"
              archetypes: [grammar]
              mastery_task_en: "Choose nominative or accusative in 12 items; name 4 things they do not eat"
              objectives:
                - code: "A1.2.U01.L03.O1"
                  can_do_en: "Refer to specific items; say what they do not eat or want"
                  skill: "grammar"
            - code: "A1.2.U01.L04"
              title: "Im Café"
              slug: "im-cafe"
              archetypes: [conversation, listening]
              mastery_task_en: "Branching café roleplay; note 3 orders and totals from audio"
              objectives:
                - code: "A1.2.U01.L04.O1"
                  can_do_en: "Order, ask for the bill and pay"
                  skill: "spoken_interaction"
            - code: "A1.2.U01.L05"
              title: "Checkpoint: Bestellen"
              slug: "checkpoint-bestellen"
              archetypes: [checkpoint]
              mastery_task_en: "Read a menu, order for two people, query the bill, pay"
              objectives:
                - code: "A1.2.U01.L05.O1"
                  can_do_en: "Complete a café visit from greeting to payment"
                  skill: "spoken_interaction"
        - code: "A1.2.U02"
          title: "Einkaufen"
          slug: "einkaufen"
          subtitle_en: "Shopping, quantities and prices"
          lessons:
            - code: "A1.2.U02.L01"
              title: "Im Supermarkt"
              slug: "im-supermarkt"
              archetypes: [vocabulary]
              mastery_task_en: "Write a shopping list from audio; say what a pictured recipe needs"
              objectives:
                - code: "A1.2.U02.L01.O1"
                  can_do_en: "Say what they need and how much"
                  skill: "vocabulary"
            - code: "A1.2.U02.L02"
              title: "Was kostet das?"
              slug: "was-kostet-das"
              archetypes: [vocabulary]
              mastery_task_en: "Write 10 dictated prices; ask the price of 5 items"
              objectives:
                - code: "A1.2.U02.L02.O1"
                  can_do_en: "Understand and say prices and larger numbers"
                  skill: "vocabulary"
            - code: "A1.2.U02.L03"
              title: "Beim Bäcker, auf dem Markt"
              slug: "beim-baecker-auf-dem-markt"
              archetypes: [conversation]
              mastery_task_en: "Counter roleplay; catch the total from audio"
              objectives:
                - code: "A1.2.U02.L03.O1"
                  can_do_en: "Buy things at a counter"
                  skill: "spoken_interaction"
            - code: "A1.2.U02.L04"
              title: "Checkpoint: Einkaufen"
              slug: "checkpoint-einkaufen"
              archetypes: [checkpoint]
              mastery_task_en: "Buy 5 listed items across bakery and market; report what it cost"
              objectives:
                - code: "A1.2.U02.L04.O1"
                  can_do_en: "Shop for a short list in two places"
                  skill: "spoken_interaction"
        - code: "A1.2.U03"
          title: "Zeit"
          slug: "zeit"
          subtitle_en: "Clock, days and word order"
          lessons:
            - code: "A1.2.U03.L01"
              title: "Wie spät ist es?"
              slug: "wie-spaet-ist-es"
              archetypes: [vocabulary]
              mastery_task_en: "Set 10 clocks from audio; say 6 times both ways"
              objectives:
                - code: "A1.2.U03.L01.O1"
                  can_do_en: "Tell and understand the time, official and everyday"
                  skill: "vocabulary"
            - code: "A1.2.U03.L02"
              title: "Wann?"
              slug: "wann"
              archetypes: [vocabulary, grammar]
              mastery_task_en: "Answer questions on an opening-hours sign; take notes on a spoken schedule"
              objectives:
                - code: "A1.2.U03.L02.O1"
                  can_do_en: "Say when things happen and read opening hours"
                  skill: "vocabulary"
            - code: "A1.2.U03.L03"
              title: "Am Montag arbeite ich"
              slug: "am-montag-arbeite-ich"
              archetypes: [grammar]
              mastery_task_en: "Reorder 8 sentences; retell a 5-item weekly plan, each sentence starting with the time"
              objectives:
                - code: "A1.2.U03.L03.O1"
                  can_do_en: "Start a sentence with a time phrase and keep the verb second"
                  skill: "grammar"
            - code: "A1.2.U03.L04"
              title: "Checkpoint: Mein Wochenplan"
              slug: "checkpoint-mein-wochenplan"
              archetypes: [checkpoint]
              mastery_task_en: "Complete a calendar from audio; write and say their own week"
              objectives:
                - code: "A1.2.U03.L04.O1"
                  can_do_en: "Understand and present a weekly schedule"
                  skill: "spoken_production"
        - code: "A1.2.U04"
          title: "Mein Tag"
          slug: "mein-tag"
          subtitle_en: "Daily routine"
          lessons:
            - code: "A1.2.U04.L01"
              title: "Ich stehe um sieben auf"
              slug: "ich-stehe-um-sieben-auf"
              archetypes: [grammar, vocabulary]
              mastery_task_en: "Describe a 6-picture day in 6 sentences"
              objectives:
                - code: "A1.2.U04.L01.O1"
                  can_do_en: "Describe a daily routine using separable verbs"
                  skill: "grammar"
            - code: "A1.2.U04.L02"
              title: "Du fährst, er liest"
              slug: "du-faehrst-er-liest"
              archetypes: [grammar]
              mastery_task_en: "Shift 10 sentences from ich to er/sie; describe a friend's day"
              objectives:
                - code: "A1.2.U04.L02.O1"
                  can_do_en: "Use common vowel-changing verbs about other people"
                  skill: "grammar"
            - code: "A1.2.U04.L03"
              title: "Immer, oft, manchmal, nie"
              slug: "immer-oft-manchmal-nie"
              archetypes: [conversation, listening]
              mastery_task_en: "Interview an audio persona with 5 questions; true/false on the passage"
              objectives:
                - code: "A1.2.U04.L03.O1"
                  can_do_en: "Say how often; understand someone describing a routine"
                  skill: "spoken_interaction"
            - code: "A1.2.U04.L04"
              title: "Checkpoint: Mein Tag"
              slug: "checkpoint-mein-tag"
              archetypes: [checkpoint]
              mastery_task_en: "Write 8 sentences on their day; speak for 45 seconds"
              objectives:
                - code: "A1.2.U04.L04.O1"
                  can_do_en: "Describe a full day in connected sentences"
                  skill: "spoken_production"
        - code: "A1.2.U05"
          title: "Freizeit"
          slug: "freizeit"
          subtitle_en: "Free time and plans"
          lessons:
            - code: "A1.2.U05.L01"
              title: "Was machst du gern?"
              slug: "was-machst-du-gern"
              archetypes: [vocabulary]
              mastery_task_en: "Rank 5 activities aloud with gern, lieber, am liebsten"
              objectives:
                - code: "A1.2.U05.L01.O1"
                  can_do_en: "Talk about hobbies and preferences"
                  skill: "vocabulary"
            - code: "A1.2.U05.L02"
              title: "Nicht oder kein?"
              slug: "nicht-oder-kein"
              archetypes: [grammar]
              mastery_task_en: "Negate 12 sentences; answer negative questions with doch or nein"
              objectives:
                - code: "A1.2.U05.L02.O1"
                  can_do_en: "Negate sentences correctly"
                  skill: "grammar"
            - code: "A1.2.U05.L03"
              title: "Kommst du mit?"
              slug: "kommst-du-mit"
              archetypes: [conversation]
              mastery_task_en: "Arrange a meeting in a chat thread and then aloud"
              objectives:
                - code: "A1.2.U05.L03.O1"
                  can_do_en: "Invite, accept, decline, and fix a time and place"
                  skill: "spoken_interaction"
            - code: "A1.2.U05.L04"
              title: "Checkpoint: Verabredung"
              slug: "checkpoint-verabredung"
              archetypes: [checkpoint]
              mastery_task_en: "Suggest, negotiate a time, confirm; write a 3-line confirmation message"
              objectives:
                - code: "A1.2.U05.L04.O1"
                  can_do_en: "Arrange a shared activity end to end"
                  skill: "spoken_interaction"
        - code: "A1.2.U06"
          title: "A1.2 Abschluss"
          slug: "a1-2-abschluss"
          subtitle_en: "Part review and checkpoint"
          lessons:
            - code: "A1.2.U06.L01"
              title: "Alltag lesen und hören (Sound Check 2)"
              slug: "alltag-lesen-und-hoeren"
              archetypes: [integrated]
              mastery_task_en: "Comprehension questions; 12 discrimination items at 80% or better"
              objectives:
                - code: "A1.2.U06.L01.O1"
                  can_do_en: "Understand a menu, a chat thread, a voicemail and an opening-hours sign"
                  skill: "reading"
            - code: "A1.2.U06.L02"
              title: "A1.2 Checkpoint"
              slug: "a1-2-checkpoint"
              archetypes: [checkpoint]
              mastery_task_en: "One Saturday: plan with a friend (chat), buy at the market, order in a café (both spoken), write 8 sentences titled Mein Samstag"
              objectives:
                - code: "A1.2.U06.L02.O1"
                  can_do_en: "Function across all A1.2 objectives"
                  skill: "spoken_interaction"
    - code: "A1.3"
      title: "Practical Communication"
      tagline: "I can get things done around town."
      units:
        - code: "A1.3.U01"
          title: "Können, wollen, müssen"
          slug: "koennen-wollen-muessen"
          subtitle_en: "Modal verbs"
          lessons:
            - code: "A1.3.U01.L01"
              title: "Ich kann…"
              slug: "ich-kann"
              archetypes: [grammar]
              mastery_task_en: "Say 5 abilities; ask an audio persona 4 questions"
              objectives:
                - code: "A1.3.U01.L01.O1"
                  can_do_en: "Say what they can and cannot do, and ask others"
                  skill: "grammar"
            - code: "A1.3.U01.L02"
              title: "Ich will, ich möchte"
              slug: "ich-will-ich-moechte"
              archetypes: [grammar]
              mastery_task_en: "Choose will or möchte for 8 contexts; say 3 plans"
              objectives:
                - code: "A1.3.U01.L02.O1"
