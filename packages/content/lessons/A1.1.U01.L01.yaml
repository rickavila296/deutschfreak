    stage: 1
    blocks:
      - code: "A1.1.U01.L01.S1.B01"
        kind: text
        text_en: "By the end of this lesson you can greet people and say goodbye, choosing words that fit the time of day and whether the situation is formal or informal."

  - code: "A1.1.U01.L01.S2"
    stage: 2
    weight: heavy
    blocks:
      - code: "A1.1.U01.L01.S2.B01"
        kind: text
        text_en: "Listen to two short meetings: two people on a course, then two neighbours."
      - code: "A1.1.U01.L01.S2.B02"
