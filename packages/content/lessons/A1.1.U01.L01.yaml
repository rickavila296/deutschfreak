# A1.1.U01.L01 Hallo und Tschüss (archetype C, conversation). Source: Curriculum Specification §3 (stages and
# weights) and §4 (this lesson's language, sound and mastery task); PRD §23 (what each stage shows).
# Weights for C: heavy Discover, Hear, Use, Mastery; light Understand; the rest normal.
