    stage: 3
    weight: light
    blocks:
      - code: "A1.1.U01.L01.S3.B01"
        kind: text
        text_en: "German greetings change with the time of day: Guten Morgen in the morning, Guten Tag during the day, Guten Abend in the evening, and Gute Nacht when someone goes to bed. Hallo and Tschüss are informal: use them with friends and people your own age. Auf Wiedersehen is the formal goodbye. Bis später means you will see each other again soon."
      - code: "A1.1.U01.L01.S3.B02"
        kind: phrase
        ref: "phrase:hallo"
        role: introduces
        status: productive
      - code: "A1.1.U01.L01.S3.B03"
